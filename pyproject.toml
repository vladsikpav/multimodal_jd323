[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vladsikpav-multimodal_jd323"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别多模态算法研究员·流水线的数据倾斜上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "vladsikpav" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://vladsikpav.github.io"
Repository = "https://github.com/vladsikpav/multimodal_jd323"
Issues = "https://github.com/vladsikpav/multimodal_jd323/issues"

[project.scripts]
multimodal_jd323 = "multimodal_jd323:main"

[tool.setuptools]
py-modules = ["multimodal_jd323"]
